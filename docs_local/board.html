<!DOCTYPE html>
<html>

<head>
    <title>3D Wood Joint Viewer</title>
    <style>
        body {
            margin: 0;
            background-color: #1a1a1a;
            overflow: hidden;
            font-family: sans-serif;
        }
        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
        }
        button {
            padding: 10px 15px;
            background: #bc8a5f;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        button:hover {
            background: #a87b55;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

<body>
    <div id="ui-container">
        <button id="cameraToggle">Switch to Parallel (Orthographic)</button>
    </div>

    <script>
        const scene = new THREE.Scene();
        
        const aspect = window.innerWidth / window.innerHeight;
        
        // 1. Perspective Camera (The default SketchUp view)
        const perspectiveCamera = new THREE.PerspectiveCamera(75, aspect, 0.1, 1000);
        perspectiveCamera.position.set(30, 20, 40);
        perspectiveCamera.lookAt(0, 0, 0);

        // 2. Parallel / Orthographic Camera (The blueprint view)
        const frustumSize = 50;
        const orthographicCamera = new THREE.OrthographicCamera(
            frustumSize * aspect / - 2, 
            frustumSize * aspect / 2, 
            frustumSize / 2, 
            frustumSize / - 2, 
            0.1, 
            1000
        );
        orthographicCamera.position.set(30, 20, 40);
        orthographicCamera.lookAt(0, 0, 0);

        // State tracker
        let activeCamera = perspectiveCamera;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const woodMaterial = new THREE.MeshStandardMaterial({ color: 0xbc8a5f, roughness: 0.6 });

        // Board 1: 36 x 6 x 0.75
        const board1Geom = new THREE.BoxGeometry(36, 6, 0.75);
        const board1 = new THREE.Mesh(board1Geom, woodMaterial);
        scene.add(board1);

        // Board 2: 12 x 6 x 0.75
        const board2Geom = new THREE.BoxGeometry(0.75, 6, 12);
        const board2 = new THREE.Mesh(board2Geom, woodMaterial);
        board2.position.set(18 + 0.375, 0, 6 - 0.375);
        scene.add(board2);

        // Lighting
        const light = new THREE.PointLight(0xffffff, 1, 100);
        light.position.set(20, 20, 20);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040));

        // Toggle Logic
        document.getElementById('cameraToggle').addEventListener('click', (e) => {
            if (activeCamera === perspectiveCamera) {
                activeCamera = orthographicCamera;
                e.target.innerText = "Switch to Perspective";
            } else {
                activeCamera = perspectiveCamera;
                e.target.innerText = "Switch to Parallel (Orthographic)";
            }
        });

        // Handle Window Resize
        window.addEventListener('resize', () => {
            const newAspect = window.innerWidth / window.innerHeight;
            
            perspectiveCamera.aspect = newAspect;
            perspectiveCamera.updateProjectionMatrix();

            orthographicCamera.left = -frustumSize * newAspect / 2;
            orthographicCamera.right = frustumSize * newAspect / 2;
            orthographicCamera.top = frustumSize / 2;
            orthographicCamera.bottom = -frustumSize / 2;
            orthographicCamera.updateProjectionMatrix();

            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            scene.rotation.y += 0.005; // Rotate the whole assembly
            renderer.render(scene, activeCamera); // Render using whichever camera is active
        }
        animate();
    </script>
</body>

</html>
